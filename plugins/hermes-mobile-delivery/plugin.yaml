name: hermes-mobile-delivery
label: Hermes 移动端
kind: platform
version: 0.0.0
description: 向 Hermes 移动端收件箱和 Bark 投递 Hermes Agent 的消息。
requires_env:
  - name: HERMES_MOBILE_INBOX_URL
    description: 应用后端收件箱投递 API 的完整 URL。
    password: false
  - name: HERMES_MOBILE_INBOX_TOKEN
    description: 应用后端的收件箱投递令牌。
    password: true
  - name: HERMES_MOBILE_HOME_CHANNEL
    description: 唯一允许的 Hermes 移动端投递目标 ID。
    password: false
optional_env:
  - name: HERMES_MOBILE_PROFILE
    description: 允许投递的 Hermes 配置档案名称，默认值为 default。
    password: false
  - name: HERMES_MOBILE_SPOOL_PATH
    description: Hermes 内待投递队列的绝对路径，默认位于当前配置档案的数据目录。
    password: false
  - name: BARK_KEY
    description: Bark 设备 Key。多个 Key 以英文逗号分隔。
    password: true
  - name: BARK_URL
    description: Bark 服务器地址，默认 https://api.day.app。
    password: false
  - name: BARK_HOME_CHANNEL
    description: Bark 定时任务的默认投递目标 ID，填写 1 即可。
    password: false
